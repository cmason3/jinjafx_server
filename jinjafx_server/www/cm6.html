<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JinjaFx - Jinja2 Templating Tool</title>
    <link rel="shortcut icon" href="/874f2915/jinjafx.png">
    <link rel="stylesheet" href="/8f8173cb/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <style>
      * {
        font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
        font-size: 14px;
      }
      #header {
        height: 75px;
      }
      #content {
        min-height: 250px;
        height: calc(100vh - 75px - 50px);
      }
      #footer {
        height: 50px;
      }
      .gutter {
        background-color: #eee;
        background-repeat: no-repeat;
        background-position: 50%;
      }
      .gutter.gutter-horizontal {
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfxAGAgYYmwGrIIiDjrELjpo5aiZeMwF+yNnOs5KSvgAAAABJRU5ErkJggg==');
        cursor: col-resize;
      }
      .gutter.gutter-vertical {
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAFAQMAAABo7865AAAABlBMVEVHcEzMzMzyAv2sAAAAAXRSTlMAQObYZgAAABBJREFUeF5jOAMEEAIEEFwAn3kMwcB6I2AAAAAASUVORK5CYII=');
        cursor: row-resize;
      }
      .labels {
        width: 20px;
        height: 100%;
        color: white;
      }
      .lb-data {
        background: #00a9d8;
      }
      .lb-gvars {
        background: #008bd9;
      }
      .lb-vars {
        background: #00a9d8;
      }
      .lb-template {
        background: #008bd9;
      }
    </style>
  </head>
  <body>
    <div id="main" class="container-fluid p-0">
      <div id="header" class="d-flex align-items-center p-2 text-bg-primary">
        <div>
          <h4>Header 1</h4>
        </div>
        <div class="ms-auto">
          <h4>Header 2</h4>
        </div>
      </div>
      <div id="content" class="p-2 text-bg-secondary">
        <div id="top" class="d-flex text-bg-danger">
          <div id="top-start">
            <h4>Top Start</h4>
          </div>
          <div id="top-end">
            <div id="top-end-top">
              <h4>Top End Top</h4>
            </div>
            <div id="top-end-bottom">
              <h4>Top End Bottom</h4>
            </div>
          </div>
        </div>
        <div id="bottom" class="overflow-auto text-bg-info">
          <div class="badge lb-template labels float-start">T<br />E<br />M<br />P<br />L<br />A<br />T<br />E<br />.<br />J<br />2<br /></div>
          <div id="template"></div>
        </div>
      </div>
      <div id="footer" class="d-flex align-items-center p-2 text-bg-warning">
        <div>
          <h4>Footer 1</h4>
        </div>
        <div class="ms-auto">
          <h4>Footer 2</h4>
        </div>
      </div>
    </div>
    <script src="/0547c89c/libs/split.js/1.6.5/split.min.js"></script>
    <script src="/c6f67021/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="/e3b0c442/js/cm6.bundle.js"></script>
    <script>
      (() => {
        window.addEventListener('load', () => {
          Split(['#top', '#bottom'], {
            direction: 'vertical',
            sizes: [50, 50],
            snapOffset: 0,
            minSize: 120
          });

          Split(['#top-start', '#top-end'], {
            direction: 'horizontal',
            sizes: [50, 50],
            snapOffset: 0,
            minSize: 300
          });

          Split(['#top-end-top', '#top-end-bottom'], {
            direction: 'vertical',
            sizes: [50, 50],
            snapOffset: 0,
            minSize: 50
          });

          cm6.createEditorView(document.getElementById('template'));
        });
      })();
    </script>
  </body>
</html>
