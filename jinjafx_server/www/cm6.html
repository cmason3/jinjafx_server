<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JinjaFx - Jinja2 Templating Tool</title>
    <link rel="shortcut icon" href="/874f2915/jinjafx.png">
    <link rel="stylesheet" href="/8f8173cb/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <style>
      * {
        font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      }
      #main {
        background-color: #eee;
      }
      #header {
        height: 70px;
      }
      #content {
        min-height: 250px;
        height: calc(100vh - 70px - 70px);
        font-size: 14px;
      }
      #footer {
        height: 70px;
      }
      .view {
        display: grid;
        grid-template-columns: 20px auto;
        height: 100%;
      }
      .gutter {
        background-color: #eee;
        background-repeat: no-repeat;
        background-position: 50%;
      }
      .gutter.gutter-horizontal {
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfxAGAgYYmwGrIIiDjrELjpo5aiZeMwF+yNnOs5KSvgAAAABJRU5ErkJggg==');
        cursor: col-resize;
      }
      .gutter.gutter-vertical {
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAFAQMAAABo7865AAAABlBMVEVHcEzMzMzyAv2sAAAAAXRSTlMAQObYZgAAABBJREFUeF5jOAMEEAIEEFwAn3kMwcB6I2AAAAAASUVORK5CYII=');
        cursor: row-resize;
      }
      .labels {
        color: white;
        font-size: 10px;
        line-height: 0.7rem;
      }
      .lb-data, .lb-vars {
        background: #00a9d8;
      }
      .lb-gvars, .lb-template {
        background: #008bd9;
      }
      .cm-editor {
        height: 100%;
        background: white;
      }
      .cm-gutter {
        min-width: 25px;
      }
    </style>
  </head>
  <body class="d-none">
    <div id="main" class="container-fluid p-0">
      <div id="header" class="d-flex align-items-center p-2 text-bg-primary">
        <div>
          <h4>Header 1</h4>
        </div>
        <div class="ms-auto">
          <h4>Header 2</h4>
        </div>
      </div>
      <div id="content" class="p-2">
        <div id="top" class="d-flex">
          <div id="cdata" class="view">
            <div class="badge labels lb-data overflow-hidden">D<br />A<br />T<br />A<br />.<br />C<br />S<br />V<br /></div>
            <div class="overflow-auto border">
              <div id="data" class="h-100"></div>
            </div>
          </div>
          <div id="cvars">
            <div id="xgvars" class="view d-none">
              <div class="badge labels lb-gvars overflow-hidden">G<br />L<br />O<br />B<br />A<br />L<br />.<br />Y<br />M<br />L<br /></div>
              <div class="overflow-auto border">
                <div id="t_gvars" class="h-100"></div>
              </div>
            </div>
            <div id="xlvars" class="view">
              <div class="badge labels lb-vars overflow-hidden">V<br />A<br />R<br />S<br />.<br />Y<br />M<br />L<br /></div>
              <div class="overflow-auto border">
                <div id="vars" class="h-100"></div>
              </div>
            </div>
          </div>
        </div>
        <div id="ctemplate" class="view">
          <div class="badge labels lb-template overflow-hidden">T<br />E<br />M<br />P<br />L<br />A<br />T<br />E<br />.<br />J<br />2<br /></div>
          <div class="overflow-auto border">
            <div id="template" class="h-100"></div>
          </div>
        </div>
      </div>
      <div id="footer" class="d-flex align-items-center p-2 text-bg-warning">
        <div>
          <h4>Footer 1</h4>
        </div>
        <div class="ms-auto">
          <h4>Footer 2</h4>
        </div>
      </div>
    </div>
    <script src="/ac3341f7/libs/split.js/1.6.5a/split.js"></script>
    <script src="/c6f67021/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="/656f7da3/js/cm6.bundle.min.js"></script>
    <script>
      (() => {
        window.addEventListener('load', () => {
          Split(['#top', '#ctemplate'], {
            direction: 'vertical',
            sizes: [40, 60],
            snapOffset: 0,
            minSize: 100
          });

          Split(['#cdata', '#cvars'], {
            direction: 'horizontal',
            sizes: [50, 50],
            snapOffset: 0,
            minSize: 200
          });

          /*
          Split(['#xgvars', '#xlvars'], {
            direction: 'vertical',
            sizes: [50, 50],
            snapOffset: 0,
            minSize: 25 
          });
          */

          let data = cm6.createDataView(document.getElementById('data'));
          let gvars = cm6.createVarsView(document.getElementById('t_gvars'));
          let vars = cm6.createVarsView(document.getElementById('vars'));
          let template = cm6.createTemplateView(document.getElementById('template'));

          setTimeout(() => {
            document.body.classList.remove('d-none');
            template.focus();
          }, 250);
        });
      })();
    </script>
  </body>
</html>
